{% extends "base.html" %}
{% block title %}Ingresar · {{ business_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock display-5 text-primary"></i>
          <h1 class="h4 mt-2">Panel de administracion</h1>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input class="form-control" name="user" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" class="form-control" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
