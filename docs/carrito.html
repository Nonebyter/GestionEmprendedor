<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cesta</title>
<meta name="theme-color" content="#38242e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="./assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<main class="container py-4">
  <h1 class="h3 mb-4"><i class="bi bi-basket2"></i> Mi cesta</h1>

  <div id="cart-empty" class="text-center text-muted py-5 d-none">
    <i class="bi bi-basket display-4"></i>
    <p class="mt-3">Tu cesta esta vacia.</p>
    <a href="./index.html" class="btn btn-primary">Ver catalogo</a>
  </div>

  <div id="cart-content" class="row g-4 d-none">
    <div class="col-12 col-lg-7">
      <div class="list-group shadow-sm" id="cart-items"></div>
      <a href="./index.html" class="btn btn-link mt-2"><i class="bi bi-arrow-left"></i> Seguir comprando</a>
    </div>
    <div class="col-12 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Datos para el pedido</h2>
          <form id="order-form">
            <div class="mb-2">
              <label class="form-label">Nombre completo *</label>
              <input class="form-control" name="customer_name" required maxlength="80">
            </div>
            <div class="mb-2">
              <label class="form-label">Telefono / WhatsApp *</label>
              <input class="form-control" name="phone" required inputmode="tel" maxlength="25">
              <div class="form-text">Con estos datos podras consultar tu pedido despues.</div>
            </div>
            <div class="mb-2">
              <label class="form-label">Correo (opcional)</label>
              <input type="email" class="form-control" name="email" maxlength="90">
            </div>
            <div class="mb-2">
              <label class="form-label">Direccion o punto de entrega</label>
              <input class="form-control" name="address" maxlength="140">
            </div>
            <div class="mb-3">
              <label class="form-label">Nota (opcional)</label>
              <textarea class="form-control" name="note" rows="2" maxlength="300"></textarea>
            </div>
            <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
              <span>Total</span><span id="cart-total">0.00</span>
            </div>
            <button class="btn btn-primary w-100 btn-lg" type="submit"><i class="bi bi-send-check"></i> Confirmar pedido</button>
            <p class="form-text text-center mt-2 mb-0">No se cobra en linea. El vendedor te contactara para confirmar.</p>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="text-center text-muted py-4 small" id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./assets/js/pages/cart-page.js"></script>
</body>
</html>
