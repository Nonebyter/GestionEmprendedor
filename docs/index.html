<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalogo</title>
<meta name="theme-color" content="#38242e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="./assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h1 class="h3 mb-0">Catalogo</h1>
      <p class="text-muted mb-0">Elige tus productos y envia tu pedido.</p>
    </div>
    <a href="./mis-pedidos.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-search"></i> Consultar mi pedido</a>
  </div>

  <div class="row g-2 mb-4">
    <div class="col-12 col-md-8">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" id="q" class="form-control" placeholder="Buscar producto...">
      </div>
    </div>
    <div class="col-12 col-md-4">
      <select class="form-select" id="cat"><option value="">Todas las categorias</option></select>
    </div>
  </div>

  <div id="grid" class="row g-3"></div>
  <div id="empty" class="text-center text-muted py-5 d-none">
    <i class="bi bi-box display-4"></i><p class="mt-3">No hay productos disponibles.</p>
  </div>
</main>

<a href="./carrito.html" class="btn btn-primary btn-lg rounded-circle shadow fab-cart">
  <i class="bi bi-basket2"></i>
  <span id="fab-badge" class="badge text-bg-danger rounded-pill position-absolute top-0 start-100 translate-middle d-none">0</span>
</a>

<footer class="text-center text-muted py-4 small" id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./assets/js/pages/catalog.js"></script>
</body>
</html>
