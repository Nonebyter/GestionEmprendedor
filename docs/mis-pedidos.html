<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis pedidos</title>
<meta name="theme-color" content="#38242e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="./assets/css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>

<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <h1 class="h3 mb-1">Consultar mis pedidos</h1>
      <p class="text-muted">Ingresa el nombre y telefono que usaste al ordenar.</p>

      <form id="buscar" class="row g-2 mb-4">
        <div class="col-12 col-md-5"><input class="form-control" name="name" placeholder="Nombre completo" required></div>
        <div class="col-12 col-md-4"><input class="form-control" name="phone" placeholder="Telefono" inputmode="tel" required></div>
        <div class="col-12 col-md-3 d-grid"><button class="btn btn-primary"><i class="bi bi-search"></i> Buscar</button></div>
      </form>

      <div id="resultados"></div>
    </div>
  </div>
</main>

<footer class="text-center text-muted py-4 small" id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./assets/js/pages/track.js"></script>
</body>
</html>
